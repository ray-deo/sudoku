<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sudoku Studio</title>
  <style>
    :root {
      --bg: #f5f2ea;
      --board-bg: #f6efe2;
      --cell-bg: #fff9f1;
      --given-bg: #e9e0c9;
      --accent: #f59e0b;
      --text: #111117;
      --muted: #7b7160;
      --line: #2b2b29;
      --thin-line: #c9c2b5;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Helvetica Neue", Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 28px;
    }

    .app {
      width: min(100%, 980px);
      background: transparent;
      border-radius: 6px;
      overflow: visible;
      display: grid;
      grid-template-columns: 1fr 360px;
      gap: 18px;
    }

    .board-panel { padding: 12px 12px 18px 12px; }
    .info-panel { padding: 12px; display: flex; flex-direction: column; gap: 12px; }

    .title { margin: 0; font-size: 1.6rem; font-weight: 800; color: var(--text); }
    .subtitle { color: var(--muted); margin-top: 6px; font-size: 0.95rem; }

    .top-bar { display:flex; justify-content:space-between; align-items:center; margin-top:8px; }
    .pill { padding:6px 10px; border-radius:999px; background:transparent; color:var(--muted); font-size:0.95rem }
    select { appearance:none; border:1px solid var(--thin-line); border-radius:8px; padding:8px 10px; background:white }

    /* Board outer frame */
    .board-wrapper { background: var(--board-bg); padding: 12px; border-radius:6px; display:inline-block; border:6px solid var(--line); }
    .board {
      display: grid;
      grid-template-columns: repeat(9, 44px);
      grid-auto-rows: 44px;
      gap: 6px;
      background: transparent;
      padding: 6px;
      border-radius: 4px;
    }

    .cell {
      display:flex; align-items:center; justify-content:center;
      background: var(--cell-bg);
      color: var(--text);
      font-size: 20px;
      font-weight: 800;
      border: 1px solid var(--thin-line);
      cursor: pointer;
      user-select: none;
      border-radius: 2px;
    }

    .cell.given { background: var(--given-bg); color: var(--text); font-weight:900; }
    .cell.selected { background: var(--accent); color: #111; }
    .cell.same-value { background: #f7e9c8; }
    .cell.wrong { background: #ffdcd0; color: #7a1f1f; }

    /* Thicker 3x3 separators using :nth-child formulas */
    .board .cell:nth-child(3n) { border-right: 3px solid var(--line); }
    .board .cell:nth-child(n+19):nth-child(-n+27),
    .board .cell:nth-child(n+46):nth-child(-n+54) {
      border-bottom: 3px solid var(--line);
    }

    /* Outer row/column edges */
    .board .cell:nth-child(-n+9) { /* top row */ }
    .board .cell:nth-child(n+73) { /* bottom row */ }

    .controls { display:flex; gap:8px; margin-top:12px }
    button.primary, button.secondary, button.ghost { border-radius:8px; padding:8px 10px; font-weight:700; border:1px solid var(--thin-line); background:white }
    button.primary { background:var(--accent); color:#111; border-color:var(--accent) }

    .stats { display:grid; grid-template-columns: 1fr 1fr; gap:8px }
    .stat-card { background:transparent; padding:6px; border-radius:6px }
    .stat-label { font-size:0.8rem; color:var(--muted) }
    .stat-value { font-size:1.05rem; font-weight:800 }

    .keypad { display:grid; grid-template-columns: repeat(3, 1fr); gap:8px }
    .keypad button { padding:10px; border-radius:6px; border:1px solid var(--thin-line); background:white; font-weight:800 }

    .message { color:var(--muted); font-weight:700 }

    @media (max-width: 720px) {
      .app { grid-template-columns: 1fr }
      .board { grid-template-columns: repeat(9, 36px); grid-auto-rows:36px }
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="board-panel">
      <h1 class="title">Sudoku Studio</h1>
      <p class="subtitle">A polished Sudoku experience with smart highlighting, quick controls, and a smooth modern interface.</p>
      <div class="top-bar">
        <div class="pill">⚡ Difficulty</div>
        <select id="difficulty">
          <option value="easy">Easy</option>
          <option value="medium" selected>Medium</option>
          <option value="hard">Hard</option>
        </select>
      </div>
      <div class="board" id="board"></div>
      <div class="controls">
        <button class="secondary" id="newGame">New Game</button>
        <button class="secondary" id="resetGame">Reset</button>
        <button class="ghost" id="hintGame">Hint</button>
        <button class="primary" id="checkGame">Check</button>
      </div>
    </div>

    <div class="info-panel">
      <div class="stats">
        <div class="stat-card">
          <div class="stat-label">Time</div>
          <div class="stat-value" id="timer">00:00</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Mistakes</div>
          <div class="stat-value" id="mistakes">0</div>
        </div>
      </div>

      <div>
        <h3 style="margin-bottom: 8px;">Numbers</h3>
        <div class="keypad" id="keypad"></div>
      </div>

      <div class="hint-box">
        <h3 style="margin: 0 0 8px;">Status</h3>
        <p id="message" class="message">Select a cell and enter a number.</p>
      </div>
    </div>
  </div>

  <script>
    const solvedBoard = [
      [5,3,4,6,7,8,9,1,2],
      [6,7,2,1,9,5,3,4,8],
      [1,9,8,3,4,2,5,6,7],
      [8,5,9,7,6,1,4,2,3],
      [4,2,6,8,5,3,7,9,1],
      [7,1,3,9,2,4,8,5,6],
      [9,6,1,5,3,7,2,8,4],
      [2,8,7,4,1,9,6,3,5],
      [3,4,5,2,8,6,1,7,9]
    ];

    const boardElement = document.getElementById('board');
    const keypadElement = document.getElementById('keypad');
    const messageElement = document.getElementById('message');
    const timerElement = document.getElementById('timer');
    const mistakesElement = document.getElementById('mistakes');
    const difficultySelect = document.getElementById('difficulty');

    let puzzleBoard = [];
    let solutionBoard = [];
    let initialBoard = [];
    let selectedCell = null;
    let mistakes = 0;
    let seconds = 0;
    let timerInterval;
    let isComplete = false;

    function createPuzzle(level) {
      const board = solvedBoard.map(row => [...row]);
      const removeCount = level === 'easy' ? 30 : level === 'hard' ? 48 : 38;
      const cells = [];
      for (let r = 0; r < 9; r++) {
        for (let c = 0; c < 9; c++) {
          cells.push([r, c]);
        }
      }
      cells.sort(() => Math.random() - 0.5);
      for (let i = 0; i < removeCount; i++) {
        const [r, c] = cells[i];
        board[r][c] = 0;
      }
      return board;
    }

    function startGame() {
      clearInterval(timerInterval);
      seconds = 0;
      mistakes = 0;
      isComplete = false;
      messageElement.textContent = 'Select a cell and enter a number.';
      messageElement.classList.remove('error');
      mistakesElement.textContent = '0';
      timerElement.textContent = '00:00';
      const level = difficultySelect.value;
      puzzleBoard = createPuzzle(level);
      initialBoard = puzzleBoard.map(row => [...row]);
      solutionBoard = solvedBoard.map(row => [...row]);
      selectedCell = null;
      render();
      startTimer();
    }

    function startTimer() {
      timerInterval = setInterval(() => {
        seconds += 1;
        const m = String(Math.floor(seconds / 60)).padStart(2, '0');
        const s = String(seconds % 60).padStart(2, '0');
        timerElement.textContent = `${m}:${s}`;
      }, 1000);
    }

    function render() {
      boardElement.innerHTML = '';
      for (let r = 0; r < 9; r++) {
        for (let c = 0; c < 9; c++) {
          const value = puzzleBoard[r][c];
          const cell = document.createElement('button');
          cell.className = 'cell';
          if (initialBoard[r][c] !== 0) cell.classList.add('given');
          if (selectedCell && selectedCell.r === r && selectedCell.c === c) cell.classList.add('selected');
          if (selectedCell && value !== 0 && value === puzzleBoard[selectedCell.r][selectedCell.c]) cell.classList.add('same-value');
          if (value !== 0 && !isValidPlacement(r, c, value, true)) cell.classList.add('conflict');
          if (value !== 0 && value !== solutionBoard[r][c]) cell.classList.add('wrong');
          cell.textContent = value === 0 ? '' : value;
          cell.addEventListener('click', () => selectCell(r, c));
          boardElement.appendChild(cell);
        }
      }

      keypadElement.innerHTML = '';
      for (let n = 1; n <= 9; n++) {
        const btn = document.createElement('button');
        btn.textContent = n;
        btn.addEventListener('click', () => enterNumber(n));
        keypadElement.appendChild(btn);
      }
    }

    function selectCell(r, c) {
      if (initialBoard[r][c] !== 0 && !isComplete) {
        selectedCell = { r, c };
        render();
        return;
      }
      selectedCell = { r, c };
      render();
    }

    function enterNumber(value) {
      if (!selectedCell || isComplete) return;
      const { r, c } = selectedCell;
      if (initialBoard[r][c] !== 0) return;

      const previous = puzzleBoard[r][c];
      puzzleBoard[r][c] = value;

      if (puzzleBoard[r][c] !== solutionBoard[r][c]) {
        mistakes += 1;
        mistakesElement.textContent = mistakes;
        messageElement.textContent = 'That entry does not match the solution.';
        messageElement.classList.add('error');
      } else {
        messageElement.textContent = 'Great choice!';
        messageElement.classList.remove('error');
      }

      if (previous === 0 && puzzleBoard[r][c] === solutionBoard[r][c]) {
        checkWin();
      } else {
        render();
      }
    }

    function clearCell() {
      if (!selectedCell || isComplete) return;
      const { r, c } = selectedCell;
      if (initialBoard[r][c] !== 0) return;
      if (puzzleBoard[r][c] !== 0) {
        puzzleBoard[r][c] = 0;
        messageElement.textContent = 'Cell cleared.';
        messageElement.classList.remove('error');
        render();
      }
    }

    function hintCell() {
      if (!selectedCell || isComplete) return;
      const { r, c } = selectedCell;
      if (initialBoard[r][c] !== 0) return;
      puzzleBoard[r][c] = solutionBoard[r][c];
      messageElement.textContent = 'Hint used: the correct value has been filled in.';
      messageElement.classList.remove('error');
      checkWin();
      render();
    }

    function isValidPlacement(r, c, value, checkCurrentCell = false) {
      for (let i = 0; i < 9; i++) {
        if (i !== c && puzzleBoard[r][i] === value) return false;
        if (i !== r && puzzleBoard[i][c] === value) return false;
      }
      const boxRow = Math.floor(r / 3) * 3;
      const boxCol = Math.floor(c / 3) * 3;
      for (let i = boxRow; i < boxRow + 3; i++) {
        for (let j = boxCol; j < boxCol + 3; j++) {
          if ((i !== r || j !== c) && puzzleBoard[i][j] === value) return false;
        }
      }
      return true;
    }

    function checkWin() {
      const flat = puzzleBoard.flat();
      if (flat.every(v => v !== 0) && isBoardComplete()) {
        isComplete = true;
        clearInterval(timerInterval);
        messageElement.textContent = 'Puzzle solved!';
        messageElement.classList.remove('error');
      } else {
        render();
      }
    }

    function isBoardComplete() {
      for (let r = 0; r < 9; r++) {
        for (let c = 0; c < 9; c++) {
          const value = puzzleBoard[r][c];
          if (value === 0) return false;
          if (!isValidPlacement(r, c, value)) return false;
        }
      }
      return true;
    }

    document.getElementById('newGame').addEventListener('click', startGame);
    document.getElementById('resetGame').addEventListener('click', () => {
      puzzleBoard = initialBoard.map(row => [...row]);
      selectedCell = null;
      mistakes = 0;
      seconds = 0;
      isComplete = false;
      clearInterval(timerInterval);
      timerElement.textContent = '00:00';
      mistakesElement.textContent = '0';
      messageElement.textContent = 'Game reset. Choose a cell.';
      messageElement.classList.remove('error');
      render();
      startTimer();
    });
    document.getElementById('hintGame').addEventListener('click', hintCell);
    document.getElementById('checkGame').addEventListener('click', () => {
      if (isBoardComplete()) {
        messageElement.textContent = 'Everything looks consistent.';
        messageElement.classList.remove('error');
      } else {
        messageElement.textContent = 'There are still conflicts in the board.';
        messageElement.classList.add('error');
      }
    });

    document.addEventListener('keydown', (e) => {
      const key = e.key;
      if (key >= '1' && key <= '9') {
        enterNumber(Number(key));
      } else if (key === 'Backspace' || key === 'Delete' || key === '0') {
        clearCell();
      }
    });

    difficultySelect.addEventListener('change', startGame);
    startGame();
  </script>
</body>
</html>
